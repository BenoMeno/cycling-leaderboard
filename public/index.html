<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cycling Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --border: rgba(255,255,255,0.07);
      --accent: #e8ff47;
      --accent-dim: rgba(232,255,71,0.12);
      --text: #f0f0f0;
      --muted: #666;
      --gold: #f5c542;
      --silver: #b0b8c1;
      --bronze: #c87941;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 780px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    /* ── Header ── */
    header {
      padding: 56px 0 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }

    .logo-block h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 10vw, 80px);
      letter-spacing: 2px;
      line-height: 0.9;
      color: var(--accent);
    }

    .logo-block p {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .month-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 18px;
      text-align: right;
    }
    .month-badge .month-name {
      font-size: 15px;
      font-weight: 500;
    }
    .month-badge .days-left {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Join button ── */
    .join-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 32px;
    }

    .btn-join {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #0a0a0a;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 11px 22px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-join:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-join:active { transform: scale(0.98); }

    .btn-join svg { width: 16px; height: 16px; }

    /* ── Podium ── */
    .podium {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
    }

    .podium-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .podium-card.first {
      border-color: rgba(245, 197, 66, 0.3);
      background: linear-gradient(160deg, #1a1700 0%, #141414 60%);
    }
    .podium-card.first::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--gold);
    }

    .podium-rank {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .podium-card.first .podium-rank { color: var(--gold); }
    .podium-card.second .podium-rank { color: var(--silver); }
    .podium-card.third .podium-rank { color: var(--bronze); }

    .podium-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 500;
      margin: 0 auto 10px;
      border: 2px solid transparent;
    }
    .podium-card.first .podium-avatar { border-color: var(--gold); background: rgba(245,197,66,0.1); }
    .podium-card.second .podium-avatar { border-color: var(--silver); background: rgba(176,184,193,0.1); }
    .podium-card.third .podium-avatar { border-color: var(--bronze); background: rgba(200,121,65,0.1); }

    .podium-name {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .podium-km {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 1px;
      color: var(--accent);
    }
    .podium-km span { font-size: 14px; color: var(--muted); font-family: 'DM Sans', sans-serif; }

    /* ── Full leaderboard ── */
    .section-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .leaderboard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .lb-row {
      display: grid;
      grid-template-columns: 40px 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .lb-row:last-child { border-bottom: none; }
    .lb-row:hover { background: var(--surface2); }

    .lb-rank {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .lb-user {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .avatar-sm {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .lb-name {
      font-size: 14px;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lb-rides {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    .lb-km {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 0.5px;
      color: var(--text);
      text-align: right;
      white-space: nowrap;
      min-width: 70px;
    }
    .lb-km small {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
    }

    /* ── Progress bar for leader distance ── */
    .lb-bar-wrap {
      grid-column: 1 / -1;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      margin-top: -8px;
      display: none;
    }
    .lb-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.6s ease; }

    /* ── States ── */
    .state-loading, .state-empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Last updated ── */
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }
    .last-updated {
      font-size: 12px;
      color: var(--muted);
    }
    .btn-refresh {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-refresh:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    /* ── Animations ── */
    .fade-in { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .stagger > * { opacity: 0; animation: fadeIn 0.35s ease forwards; }
    .stagger > *:nth-child(1) { animation-delay: 0.05s; }
    .stagger > *:nth-child(2) { animation-delay: 0.10s; }
    .stagger > *:nth-child(3) { animation-delay: 0.15s; }
    .stagger > *:nth-child(4) { animation-delay: 0.20s; }
    .stagger > *:nth-child(5) { animation-delay: 0.25s; }
    .stagger > *:nth-child(6) { animation-delay: 0.30s; }
    .stagger > *:nth-child(7) { animation-delay: 0.35s; }
    .stagger > *:nth-child(8) { animation-delay: 0.40s; }
    .stagger > *:nth-child(n+9) { animation-delay: 0.45s; }

    /* ── Notification toast ── */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 8px;
      transition: transform 0.3s ease;
      z-index: 100;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 500px) {
      .podium { grid-template-columns: 1fr; }
      .lb-row { grid-template-columns: 30px 1fr auto; }
      .lb-rides { display: none; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <div class="logo-block">
      <h1>Velodrome</h1>
      <p>Monthly Cycling Challenge</p>
    </div>
    <div class="month-badge">
      <div class="month-name" id="monthName">—</div>
      <div class="days-left" id="daysLeft">—</div>
    </div>
  </header>

  <div class="join-bar">
    <a href="/auth/strava" class="btn-join" id="joinBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Join with Strava
    </a>
  </div>

  <div id="podium" class="podium" style="display:none"></div>

  <p class="section-label" id="boardLabel" style="display:none">All Riders</p>
  <div class="leaderboard" id="leaderboard">
    <div class="state-loading">
      <div class="spinner"></div>
      Loading leaderboard…
    </div>
  </div>

  <div class="footer-row">
    <span class="last-updated" id="lastUpdated"></span>
    <button class="btn-refresh" onclick="loadLeaderboard()">↻ Refresh</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── Helpers ──────────────────────────────────────────────
  const $ = id => document.getElementById(id);

  function initials(name) {
    return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  }

  function avatarColor(name) {
    const colors = ['#2a4a8a','#5a2a8a','#8a2a5a','#2a7a4a','#7a5a2a','#2a6a7a'];
    let h = 0;
    for (let c of name) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
    return colors[h % colors.length];
  }

  function showToast(msg, dur = 2500) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), dur);
  }

  function setMonthInfo() {
    const now = new Date();
    const last = new Date(now.getFullYear(), now.getMonth()+1, 0);
    const daysLeft = last.getDate() - now.getDate();
    $('monthName').textContent = now.toLocaleString('default', { month: 'long', year: 'numeric' });
    $('daysLeft').textContent = daysLeft === 0 ? 'Last day!' : `${daysLeft} days left`;
  }

  // ── Render leaderboard ────────────────────────────────────
  function renderLeaderboard(riders) {
    const lb = $('leaderboard');
    const podiumEl = $('podium');

    if (!riders || riders.length === 0) {
      lb.innerHTML = '<div class="state-empty">No rides logged this month yet. Be the first! 🚴</div>';
      podiumEl.style.display = 'none';
      $('boardLabel').style.display = 'none';
      return;
    }

    const sorted = [...riders].sort((a,b) => b.km - a.km);
    const maxKm = sorted[0].km;

    // Podium (top 3)
    const medals = ['first','second','third'];
    const medalLabels = ['🥇 1st Place','🥈 2nd Place','🥉 3rd Place'];
    const top3 = sorted.slice(0,3);
    // reorder: 2nd, 1st, 3rd visually
    const podiumOrder = top3.length >= 2 ? [top3[1], top3[0], top3[2]].filter(Boolean) : top3;
    const podiumClasses = top3.length >= 2 ? ['second','first','third'] : ['first'];

    podiumEl.innerHTML = podiumOrder.map((r, i) => {
      const cls = podiumClasses[i];
      const origIdx = sorted.indexOf(r);
      return `
        <div class="podium-card ${cls} fade-in" style="animation-delay:${i*0.08}s">
          <div class="podium-rank">${medalLabels[origIdx] || `#${origIdx+1}`}</div>
          <div class="podium-avatar" style="background:${avatarColor(r.name)}22; border-color:${avatarColor(r.name)}88">
            ${initials(r.name)}
          </div>
          <div class="podium-name">${r.name}</div>
          <div class="podium-km">${r.km.toFixed(1)}<span> km</span></div>
        </div>`;
    }).join('');
    podiumEl.style.display = 'grid';
    $('boardLabel').style.display = 'block';

    // Full list
    lb.innerHTML = `<div class="stagger">${sorted.map((r, i) => `
      <div class="lb-row">
        <div class="lb-rank">${i+1}</div>
        <div class="lb-user">
          <div class="avatar-sm" style="background:${avatarColor(r.name)}22; border-color:${avatarColor(r.name)}55; color:${avatarColor(r.name)}">${initials(r.name)}</div>
          <span class="lb-name">${r.name}</span>
        </div>
        <div class="lb-rides">${r.rides} ride${r.rides !== 1 ? 's' : ''}</div>
        <div class="lb-km">${r.km.toFixed(1)}<small> km</small></div>
      </div>`).join('')}
    </div>`;
  }

  // ── Load data ─────────────────────────────────────────────
  async function loadLeaderboard() {
    try {
      const res = await fetch('/api/leaderboard');
      if (!res.ok) throw new Error('Server error');
      const data = await res.json();
      renderLeaderboard(data.riders);
      $('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch(e) {
      $('leaderboard').innerHTML = '<div class="state-empty">Could not load data. Is the server running?</div>';
    }
  }

  // ── Check if user just connected ─────────────────────────
  const params = new URLSearchParams(location.search);
  if (params.get('connected') === '1') {
    showToast('✓ Connected! Your rides will appear shortly.');
    history.replaceState({}, '', '/');
  }
  if (params.get('error')) {
    showToast('Connection failed: ' + params.get('error'));
    history.replaceState({}, '', '/');
  }

  setMonthInfo();
  loadLeaderboard();
  // Auto-refresh every 5 minutes
  setInterval(loadLeaderboard, 5 * 60 * 1000);
</script>
</body>
</html>
